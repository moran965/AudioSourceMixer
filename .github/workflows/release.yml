name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to release
        required: true
        default: v1.0.0
        type: string
      hardware_gate_attested:
        description: Maintainer attests the documented browser and physical-output acceptance scope
        required: true
        default: false
        type: boolean
      publish:
        description: Publish the verified release instead of leaving a Draft
        required: true
        default: false
        type: boolean
      signing_mode:
        description: Authenticode signing path
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - signpath
          - azure
      allow_unsigned_release:
        description: Explicitly permit a NotSigned release (unsigned mode only)
        required: true
        default: false
        type: boolean
      unsigned_risk_ack:
        description: For unsigned mode, enter exactly PUBLISH UNSIGNED V1.0.0
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, attest, and release
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HARDWARE_GATE: ${{ inputs.hardware_gate_attested }}
      SIGNING_MODE: ${{ inputs.signing_mode }}
      ALLOW_UNSIGNED: ${{ inputs.allow_unsigned_release }}
      UNSIGNED_RISK_ACK: ${{ inputs.unsigned_risk_ack }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_INTERNAL_POLICY_SLUG: ${{ vars.SIGNPATH_INTERNAL_POLICY_SLUG }}
      SIGNPATH_INTERNAL_ARTIFACT_CONFIGURATION: ${{ vars.SIGNPATH_INTERNAL_ARTIFACT_CONFIGURATION }}
      SIGNPATH_INSTALLER_POLICY_SLUG: ${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}
      SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Validate explicit release decisions
        shell: powershell
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:RELEASE_TAG" }
          if ($env:HARDWARE_GATE -ne 'true') { throw 'The documented maintainer hardware gate is not attested.' }
          if ($env:SIGNING_MODE -eq 'unsigned') {
            if ($env:ALLOW_UNSIGNED -ne 'true') { throw 'Unsigned release was not explicitly allowed.' }
            if ($env:UNSIGNED_RISK_ACK -cne 'PUBLISH UNSIGNED V1.0.0') { throw 'Unsigned risk confirmation did not match exactly.' }
          } elseif ($env:SIGNING_MODE -eq 'signpath') {
            foreach ($name in 'SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_INTERNAL_POLICY_SLUG','SIGNPATH_INTERNAL_ARTIFACT_CONFIGURATION','SIGNPATH_INSTALLER_POLICY_SLUG','SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION') {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required SignPath setting is missing: $name" }
            }
          } elseif ($env:SIGNING_MODE -eq 'azure') {
            foreach ($name in 'AZURE_SIGNING_ENDPOINT','AZURE_SIGNING_ACCOUNT','AZURE_SIGNING_PROFILE','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID') {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required Azure signing setting is missing: $name" }
            }
          } else { throw "Unsupported signing mode: $env:SIGNING_MODE" }

      - name: Checkout the complete tagged history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag, clean checkout, and versions
        shell: powershell
        run: |
          if ((git cat-file -t $env:RELEASE_TAG) -ne 'tag') { throw "$env:RELEASE_TAG is not an annotated tag." }
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw "Tag commit $tagCommit does not match checkout $headCommit." }
          [xml]$props = Get-Content .\Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.AudioSourceMixerVersion
          $extensionVersion = [string](Get-Content .\src\AudioSourceMixer.BrowserExtension\manifest.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG -or $version -ne $extensionVersion) { throw 'Tag, product, and extension versions do not agree.' }
          if ([string]$props.Project.PropertyGroup.AssemblyVersion -ne '1.0.0.0' -or [string]$props.Project.PropertyGroup.FileVersion -ne '1.0.0.0') { throw 'Assembly/file version is not 1.0.0.0.' }
          if (git status --porcelain) { throw 'Release checkout is not clean.' }

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Restore, build, test, and audit
        shell: powershell
        run: |
          dotnet restore .\AudioSourceMixer.sln
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build .\AudioSourceMixer.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          dotnet test .\AudioSourceMixer.sln --configuration Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw '.NET tests failed.' }
          Push-Location .\src\AudioSourceMixer.BrowserExtension
          try { npm test; if ($LASTEXITCODE -ne 0) { throw 'Browser extension tests failed.' } } finally { Pop-Location }
          .\scripts\audit-repository.ps1
          $gitleaks = & .\scripts\install-gitleaks.ps1
          & $gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
          if ($LASTEXITCODE -ne 0) { throw 'Gitleaks reachable-history scan failed.' }
          & $gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
          if ($LASTEXITCODE -ne 0) { throw 'Gitleaks working-tree scan failed.' }

      - name: Publish fresh internal executables
        shell: powershell
        run: |
          $desktop = Join-Path $env:RUNNER_TEMP 'asm-publish\desktop'
          $host = Join-Path $env:RUNNER_TEMP 'asm-publish\native-host'
          dotnet publish .\src\AudioSourceMixer.Desktop\AudioSourceMixer.Desktop.csproj -c Release -r win-x64 --self-contained true -o $desktop -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed.' }
          dotnet publish .\src\AudioSourceMixer.NativeHost\AudioSourceMixer.NativeHost.csproj -c Release -r win-x64 --self-contained true -o $host -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          if ($LASTEXITCODE -ne 0) { throw 'Native Host publish failed.' }

      - name: Upload internal PE files for SignPath
        if: inputs.signing_mode == 'signpath'
        id: upload-signpath-internal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-internal-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/asm-publish/desktop/AudioSourceMixer.exe
            ${{ runner.temp }}/asm-publish/native-host/AudioSourceMixer.NativeHost.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign internal PE files with SignPath Foundation
        if: inputs.signing_mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_INTERNAL_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INTERNAL_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload-signpath-internal.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signed-internal
          parameters: |
            version: ${{ toJSON(inputs.tag) }}

      - name: Azure login with OIDC
        if: inputs.signing_mode == 'azure'
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign internal PE files with Azure Artifact Signing
        if: inputs.signing_mode == 'azure'
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ runner.temp }}\asm-publish\desktop\AudioSourceMixer.exe
            ${{ runner.temp }}\asm-publish\native-host\AudioSourceMixer.NativeHost.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Verify internal state and build a fresh installer
        shell: powershell
        run: |
          $desktop = Join-Path $env:RUNNER_TEMP 'asm-publish\desktop\AudioSourceMixer.exe'
          $host = Join-Path $env:RUNNER_TEMP 'asm-publish\native-host\AudioSourceMixer.NativeHost.exe'
          if ($env:SIGNING_MODE -eq 'signpath') {
            $desktopMatches = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'signed-internal') -Filter AudioSourceMixer.exe -File -Recurse)
            $hostMatches = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'signed-internal') -Filter AudioSourceMixer.NativeHost.exe -File -Recurse)
            if ($desktopMatches.Count -ne 1 -or $hostMatches.Count -ne 1) { throw 'SignPath did not return exactly one signed desktop and Native Host executable.' }
            $desktop = $desktopMatches[0].FullName
            $host = $hostMatches[0].FullName
          }
          foreach ($file in $desktop,$host) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($env:SIGNING_MODE -eq 'unsigned') {
              if ($signature.Status -ne 'NotSigned') { throw "Unsigned internal file is not NotSigned: $file ($($signature.Status))" }
            } elseif ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate) {
              throw "Trusted internal signature is incomplete: $file ($($signature.Status))"
            }
          }
          .\scripts\package-installer.ps1 -Configuration Release -DesktopPublishPath (Split-Path $desktop -Parent) -NativeHostPublishPath (Split-Path $host -Parent)

      - name: Upload setup for SignPath
        if: inputs.signing_mode == 'signpath'
        id: upload-signpath-setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-setup-${{ inputs.tag }}
          path: artifacts/AudioSourceMixer-1.0.0-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign setup with SignPath Foundation
        if: inputs.signing_mode == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload-signpath-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signed-setup
          parameters: |
            version: ${{ toJSON(inputs.tag) }}

      - name: Install SignPath-signed setup result
        if: inputs.signing_mode == 'signpath'
        shell: powershell
        run: |
          $matches = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'signed-setup') -Filter AudioSourceMixer-1.0.0-win-x64-setup.exe -File -Recurse)
          if ($matches.Count -ne 1) { throw 'SignPath did not return exactly one signed setup executable.' }
          Copy-Item -LiteralPath $matches[0].FullName -Destination .\artifacts\AudioSourceMixer-1.0.0-win-x64-setup.exe -Force

      - name: Sign setup with Azure Artifact Signing
        if: inputs.signing_mode == 'azure'
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\artifacts\AudioSourceMixer-1.0.0-win-x64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Verify final signatures, install, and create checksums
        shell: powershell
        run: |
          $trusted = $env:SIGNING_MODE -ne 'unsigned'
          $setup = '.\artifacts\AudioSourceMixer-1.0.0-win-x64-setup.exe'
          $payload = '.\artifacts\staging\1.0.0\installer-runtime-payload'
          foreach ($file in @((Join-Path $payload 'AudioSourceMixer.exe'),(Join-Path $payload 'AudioSourceMixer.NativeHost.exe'),$setup)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($trusted) {
              if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate) { throw "Trusted signature check failed: $file" }
            } elseif ($signature.Status -ne 'NotSigned') { throw "Unsigned mode produced a signed or invalid file: $file ($($signature.Status))" }
          }
          if ($trusted) { .\scripts\finalize-signed-release.ps1 -RequireTrustedSignature }
          else { .\scripts\finalize-signed-release.ps1 }
          .\scripts\verify-installer.ps1
          $installed = '.\artifacts\installed\AudioSourceMixer'
          foreach ($file in @((Join-Path $installed 'AudioSourceMixer.exe'),(Join-Path $installed 'AudioSourceMixer.NativeHost.exe'),(Join-Path $installed 'AudioSourceMixer.Uninstall.exe'))) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Installed signature evidence is missing: $file" }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($trusted) {
              if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate) { throw "Installed trusted signature check failed: $file" }
            } elseif ($signature.Status -ne 'NotSigned') { throw "Installed unsigned signature check failed: $file ($($signature.Status))" }
          }
          $commit = git rev-parse HEAD
          .\scripts\prepare-release-notes.ps1 -SigningMode $env:SIGNING_MODE -Tag $env:RELEASE_TAG -Commit $commit

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts/staging/1.0.0/installer-runtime-payload
          format: spdx-json
          output-file: artifacts/AudioSourceMixer-1.0.0.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest final release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/AudioSourceMixer-1.0.0-win-x64-setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/AudioSourceMixer-1.0.0.spdx.json

      - name: Create, verify, and optionally publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title 'Audio Source Mixer 1.0.0' --notes-file .\artifacts\release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Draft Release.' }
          } else {
            gh release edit $env:RELEASE_TAG --title 'Audio Source Mixer 1.0.0' --notes-file .\artifacts\release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update Release notes.' }
          }
          gh release upload $env:RELEASE_TAG --clobber .\artifacts\AudioSourceMixer-1.0.0-win-x64-setup.exe .\artifacts\SHA256SUMS.txt .\artifacts\AudioSourceMixer-1.0.0.spdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the approved Release assets.' }
          $actual = @((gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json).assets.name | Sort-Object)
          $expected = @('AudioSourceMixer-1.0.0-win-x64-setup.exe','AudioSourceMixer-1.0.0.spdx.json','SHA256SUMS.txt' | Sort-Object)
          if (@(Compare-Object $expected $actual).Count -ne 0) { throw "Unexpected Release assets: $($actual -join ', ')" }
          if ('${{ inputs.publish }}' -eq 'true') {
            gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified Release.' }
          }
