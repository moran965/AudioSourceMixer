name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please describe the user problem without sharing private audio, logs, device IDs, browsing data, or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope
      options:
        - label: This request does not require telemetry, remote code, a driver, or changing the Windows default device.
