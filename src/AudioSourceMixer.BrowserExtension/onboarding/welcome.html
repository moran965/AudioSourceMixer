<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="welcomePageTitle"></title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
<main>
  <div class="language-picker"><label for="languageSelect" data-i18n="languageLabel"></label><select id="languageSelect" data-i18n-aria-label="languageLabel"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></div>
  <p class="eyebrow">Audio Source Mixer</p>
  <h1 data-i18n="welcomeHeading"></h1>
  <p class="lead" data-i18n="welcomeLead"></p>
  <p class="return-note" data-i18n="welcomeReturn"></p>

  <ol>
    <li><strong data-i18n="welcomeStep1Title"></strong><span data-i18n="welcomeStep1Body"></span></li>
    <li><strong data-i18n="welcomeStep2Title"></strong><span data-i18n="welcomeStep2Body"></span></li>
    <li><strong data-i18n="welcomeStep3Title"></strong><span data-i18n="welcomeStep3Body"></span></li>
    <li><strong data-i18n="welcomeStep4Title"></strong><span data-i18n="welcomeStep4Body"></span></li>
  </ol>

  <section>
    <h2 data-i18n="welcomeOutputTitle"></h2>
    <p data-i18n="welcomeOutputBody"></p>
  </section>

  <section id="detailed-guide" tabindex="-1" hidden>
    <h2 data-i18n="welcomeDetailsTitle"></h2>
    <ol>
      <li><strong data-i18n="welcomeDetail1Title"></strong><span data-i18n="welcomeDetail1Body"></span></li>
      <li><strong data-i18n="welcomeDetail2Title"></strong><span data-i18n="welcomeDetail2Body"></span></li>
      <li><strong data-i18n="welcomeDetail3Title"></strong><span data-i18n="welcomeDetail3Body"></span></li>
      <li><strong data-i18n="welcomeDetail4Title"></strong><span data-i18n="welcomeDetail4Body"></span></li>
      <li><strong data-i18n="welcomeDetail5Title"></strong><span data-i18n="welcomeDetail5Body"></span></li>
    </ol>
  </section>

  <div class="actions">
    <button id="complete" data-i18n="welcomeComplete"></button>
    <button id="details" class="secondary" aria-controls="detailed-guide" aria-expanded="false" data-i18n="welcomeOpenDetails"></button>
    <button id="never" class="quiet" data-i18n="welcomeNever"></button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="welcome.js"></script>
</body>
</html>
