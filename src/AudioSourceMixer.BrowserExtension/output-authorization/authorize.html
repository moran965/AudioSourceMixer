<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="authorizePageTitle"></title>
  <link rel="stylesheet" href="authorize.css">
</head>
<body>
<main>
  <div class="language-picker"><label for="languageSelect" data-i18n="languageLabel"></label><select id="languageSelect" data-i18n-aria-label="languageLabel"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></div>
  <header>
    <p class="eyebrow">Audio Source Mixer</p>
    <h1 data-i18n="authorizeHeading"></h1>
    <p class="lead" data-i18n="authorizeLead"></p>
  </header>

  <section class="wizard" aria-labelledby="wizardTitle">
    <div class="step"><span>1</span><div><strong id="wizardTitle" data-i18n="authorizeConnecting"></strong><p id="targetName" data-i18n="authorizeNoPending"></p></div></div>
    <label for="pendingTargets" data-i18n="authorizePendingLabel"></label>
    <select id="pendingTargets" disabled><option value="" data-i18n="authorizeNoPendingOption"></option></select>
    <p id="instruction" data-i18n="authorizeInstruction"></p>

    <div class="step"><span>2</span><div><strong data-i18n="authorizeChoosePhysical"></strong><p data-i18n="authorizeChoosePhysicalBody"></p></div></div>
    <div class="actions">
      <button id="chooseOutput" disabled data-i18n="authorizeOpenDeviceList"></button>
      <button id="unlockDevices" class="secondary" disabled data-i18n="authorizeShowCompatible"></button>
    </div>
    <div id="fallbackArea" class="fallback hidden">
      <label for="fallbackDevices" data-i18n="authorizeBrowserOutputs"></label>
      <select id="fallbackDevices" disabled><option value="" data-i18n="authorizeNoOutputs"></option></select>
      <button id="useFallback" class="secondary" disabled data-i18n="authorizeUseCandidate"></button>
    </div>

    <div id="candidatePanel" class="candidate hidden">
      <div class="step"><span>3</span><div><strong data-i18n="authorizeListenConfirm"></strong><p data-i18n="authorizeListenConfirmBody"></p></div></div>
      <dl><div><dt data-i18n="authorizeWindowsDevice"></dt><dd id="candidateWindows">—</dd></div><div><dt data-i18n="authorizeBrowserDevice"></dt><dd id="candidateBrowser">—</dd></div></dl>
      <p id="compatibility" class="notice"></p>
      <div class="actions">
        <button id="testCandidate" data-i18n="authorizePlayTest"></button>
        <button id="confirmCandidate" class="success" data-i18n="authorizeConfirm"></button>
        <button id="reselectCandidate" class="secondary" data-i18n="authorizeReselect"></button>
        <button id="cancelCandidate" class="quiet" data-i18n="authorizeCancel"></button>
      </div>
    </div>
    <button id="retryNotification" class="secondary hidden" data-i18n="authorizeRetryNotification"></button>
    <div id="status" role="status" aria-live="polite" data-i18n="authorizeReading"></div>
  </section>

  <section aria-labelledby="mappingTitle">
    <div class="section-title"><div><h2 id="mappingTitle" data-i18n="mappingTitle"></h2><p data-i18n="mappingDescription"></p></div><button id="clearAll" class="danger" data-i18n="mappingClearAll"></button></div>
    <div id="mappings" class="mapping-list"><p class="empty" data-i18n="mappingEmpty"></p></div>
  </section>
</main>
<script type="module" src="authorize.js"></script>
</body>
</html>
